<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">RuleRelay</title>
  <desc id="desc">A dark navy banner showing linked rule documents flowing into a clear agent instruction map.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#182b4d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50e3c2"/>
      <stop offset="1" stop-color="#7aa2ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="78" r="170" fill="#50e3c2" opacity=".08"/>
  <circle cx="1130" cy="300" r="205" fill="#7aa2ff" opacity=".07"/>
  <g fill="#132947" stroke="#50e3c2" stroke-width="2">
    <rect x="715" y="72" width="170" height="72" rx="12"/>
    <rect x="715" y="162" width="170" height="72" rx="12"/>
    <rect x="715" y="252" width="170" height="72" rx="12"/>
  </g>
  <g fill="#dce7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
    <text x="742" y="116">AGENTS.md</text>
    <text x="732" y="206">CLAUDE.md</text>
    <text x="727" y="296">Copilot rules</text>
  </g>
  <path d="M885 108 H968 M885 198 H968 M885 288 H968" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <path d="M950 88 L978 108 L950 128 M950 178 L978 198 L950 218 M950 268 L978 288 L950 308" fill="none" stroke="#7aa2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="978" y="118" width="150" height="160" rx="18" fill="#0c172b" stroke="#7aa2ff" stroke-width="3"/>
  <path d="M1010 160 H1096 M1010 198 H1080 M1010 236 H1102" stroke="#50e3c2" stroke-width="6" stroke-linecap="round"/>
  <text x="70" y="142" fill="#f4f8ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="700">RuleRelay</text>
  <text x="75" y="193" fill="#b5c7e8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28">Make AI coding-agent rules explainable and verifiable.</text>
  <rect x="75" y="238" width="455" height="55" rx="27" fill="#10213d" stroke="#31527e"/>
  <text x="102" y="274" fill="#50e3c2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">scan → explain → check</text>
</svg>
